services:
  - type: web
    name: face-mask-compliance-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_WEIGHTS
        value: best_yolov8l_weights.pt
